[package]
name = "nsh-app-hjkl-quest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false }

# Lints: the compiler's and Clippy's, with the pedantic group on. The few
# allowed below are noise for a game that draws with f32 coordinates and
# indexes small grids (the casts can't overflow) and names colors in hex.
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Function size and complexity (thresholds in clippy.toml).
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
# Leftovers that must not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints that don't fit this code base.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unreadable_literal = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# x, y, w, h, r: the usual names in geometry.
many_single_char_names = "allow"
